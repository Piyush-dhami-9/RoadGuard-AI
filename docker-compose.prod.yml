services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roadguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadguard}
      POSTGRES_DB: ${POSTGRES_DB:-roadguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadguard -d roadguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: roadguard-backend:${TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://roadguard:roadguard@db:5432/roadguard}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MODEL_WEIGHTS: ${MODEL_WEIGHTS:-/app/model/weights/best.pt}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./reports/generated:/app/reports/generated
      - ./model:/app/model
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: roadguard-frontend:${TAG:-latest}
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
